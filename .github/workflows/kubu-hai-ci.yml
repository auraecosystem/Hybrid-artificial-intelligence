name: KUBU-HAI Runtime CI

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "kubu_hai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/kubu-hai-ci.yml"
  pull_request:
    paths:
      - "kubu_hai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/kubu-hai-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[security]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile runtime modules
        run: python -m compileall -q kubu_hai
      - name: Run runtime unit tests
        # The separate test_102_require.py requires pytest and an Apache test
        # harness; it is not part of the KUBU-HAI unittest suite.
        run: python -m unittest discover -s tests -p 'test_[a-z]*.py' -v
