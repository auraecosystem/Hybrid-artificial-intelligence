name: KUBU-HAI Runtime CI

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "kubu_hai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/kubu-hai-ci.yml"
  pull_request:
    paths:
      - "kubu_hai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/kubu-hai-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python modules
        run: python -m compileall -q kubu_hai tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
