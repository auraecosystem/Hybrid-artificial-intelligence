name: KUBU-HAI Runtime CI

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "kubu_hai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/kubu-hai-ci.yml"
  pull_request:
    paths:
      - "kubu_hai/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/kubu-hai-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the runtime and CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile runtime and tests
        run: python -m compileall -q kubu_hai
      - name: Run KUBU-HAI unit tests
        # test_102_require.py is an unrelated Apache/pytest integration test
        # and requires its own httpd test harness. Keep it out of unittest CI.
        run: python -m unittest discover -s tests -p 'test_[a-z]*.py' -v
