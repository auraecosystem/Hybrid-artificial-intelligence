name: KUBU-HAI Hardware Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "kubu_hai/backends/**"
      - "kubu_hai/artifacts.py"
      - "tests/test_torch_backends.py"
      - "tests/test_artifacts.py"
      - ".github/workflows/kubu-hai-hardware.yml"

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m compileall -q kubu_hai tests
      - run: python -m unittest discover -s tests -v

  cuda:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, cuda]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[torch]'
      - run: python -c "import torch; assert torch.cuda.is_available(), 'CUDA runner has no usable CUDA device'"
      - run: python -m unittest discover -s tests -p 'test_torch_backends.py' -v

  apple-metal:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS, ARM64, metal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[torch]'
      - run: python -c "import torch; assert torch.backends.mps.is_built() and torch.backends.mps.is_available(), 'MPS runner unavailable'"
      - run: python -m unittest discover -s tests -p 'test_torch_backends.py' -v
