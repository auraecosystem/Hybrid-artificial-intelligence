[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubu-hai-runtime"
version = "0.1.0"
description = "Backend-neutral hybrid AI inference orchestration foundation"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Seriki Walter Yakub" }]
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.3"]
security = ["cryptography>=42"]

[tool.setuptools.packages.find]
include = ["kubu_hai*"]
